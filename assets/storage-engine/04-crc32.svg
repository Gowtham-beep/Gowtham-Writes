  <g fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 82c210-12 420-12 631 0"/>
    <path d="M74 82c-5 35-4 70 3 105 209 12 418 12 628 0 7-35 7-70 0-105"/>
    <path d="M187 82c-7 35-7 70 0 105"/>
    <path d="M563 82c-7 35-7 70 0 105"/>
    <path d="M748 92c19-12 40-14 61-4 23 12 32 34 27 58-5 25-23 43-49 48-24 5-45-5-58-25"/>
    <path d="M763 147c8 8 16 16 25 24"/>
    <path d="M791 143c-13 13-25 25-38 39"/>
  </g>
  <g fill="#fbfff9" stroke="#1f2937" stroke-width="2">
    <rect x="88" y="116" width="92" height="38" rx="8"/>
    <rect x="252" y="96" width="230" height="78" rx="8"/>
    <rect x="586" y="116" width="95" height="38" rx="8"/>
    <rect x="715" y="194" width="170" height="40" rx="8"/>
  </g>
  <g font-family="monospace" font-weight="700" fill="#111827">
    <text x="100" y="144" font-size="24">len</text>
    <text x="273" y="129" font-size="34">000000</text>
    <text x="278" y="162" font-size="24">ghost bytes</text>
    <text x="598" y="144" font-size="24">CRC</text>
    <text x="735" y="224" font-size="28">mismatch</text>
  </g>
  <g fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round">
    <path d="M246 101c89 54 182 54 276 0"/>
    <path d="M247 168c90-50 181-50 273 0"/>
  </g>
</svg>
