<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">CRC32 ghost bytes sketch</title>
  <desc id="desc">A scribble-style record with valid structure, ghost zero payload bytes, and a checksum catching corruption.</desc>
