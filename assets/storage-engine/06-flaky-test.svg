    <path d="M78 48c214-15 428-15 642 0"/>
    <path d="M78 48c-8 53-8 106 1 159 213 15 426 15 640 0 9-53 8-106 1-159"/>
    <path d="M78 82c214 9 428 9 642 0"/>
    <path d="M106 65c0 1 0 2 1 3"/>
    <path d="M133 65c0 1 0 2 1 3"/>
    <path d="M160 65c0 1 0 2 1 3"/>
    <path d="M755 102c18 9 34 20 48 34"/>
    <path d="M802 105c-15 21-29 42-44 63"/>
    <path d="M782 167c20 14 35 30 47 50"/>
    <path d="M829 170c-20 15-38 32-54 51"/>
  </g>
